<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height:100vh;
            width:100vw;
        }
        .container{
            height:100%;
            width:100%;
            background-color:rgb(239, 182, 125);
            display:grid;
            padding:4rem;
            row-gap:1rem;
            column-gap:1rem;
            /* grid-template-columns:100px,100px,100px;
            grid-template-rows:100px,100px,100px;
             */
             grid-template-columns:repeat(3,1fr);
        }
        .item{
            background-color:rgb(248, 161, 161);
            border:5px solid grey;
            display:flex;
            justify-content:center;
            font-size:2rem;
        }
        .header,.footer{
            grid-column-start:1;
            grid-column-end:4;
        }

        /* .footer{
            grid-column-start:1; agra alag likhna hai toh
            grid-column-end:4;
        } */
         .sidebar{
            grid-row-start:2;
            grid-row-end:4;
            grid-coloum-start:1;
            
            
         }
         .content{
            grid-column-start:2;
            grid-column-end:4;
         }
    </style>
</head>
<body>
    <div class="container">
        <div class="item header">Header</div>
        <div class="item sidebar">sidebar</div>
        <div class="item content">content1</div>
        <div class="item">content2</div>
        <div class="item">content3</div>
        <div class="item footer">Footer</div>
</body>
</html>
