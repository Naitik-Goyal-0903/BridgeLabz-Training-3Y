<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height:100vh;
            width:100vw;
            background-color:rgb(239, 182, 125);
            border:5px solid black;
        }
        .box{
            height:100px;
            width:350px;
            background-color:rgb(138, 138, 138);
            border:5px solid black;
            border-radius:10px;
            margin:10px;
            position:relative;
            animation-name:rightmovement;
            animation-duration:5s;
            animation-iteration-count:infinite; 
            animation-delay:0s;
            animation-timing-function: cubic-bezier(0.1,-0.4);
            animation-direction:reverse;
        }
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
           
        }
        @keyframes rightmovement{
            from{
                top:0px;
                left:0px;
            }
            to{
                top:0px;
                left:1200px;
            }   
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
        </div>
    </div>
</body>
</html>
